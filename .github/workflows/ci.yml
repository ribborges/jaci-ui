name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JACI_STORYBOOK_BROWSER: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @jaci-ui/storybook exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm storybook:build
      - run: pnpm package:check
      - run: pnpm fixtures:check
      - run: pnpm fixtures:pack-check
