name: Publish package

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (use rc for prereleases)"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - rc

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    env:
      JACI_STORYBOOK_BROWSER: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm --filter @jaci-ui/storybook exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm coverage:contract:strict
      - run: pnpm package:check
      - run: pnpm --filter jaci-ui publish --access public --no-git-checks --tag "${{ inputs.dist_tag }}"
