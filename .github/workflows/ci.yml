name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 10.15.1
  NODE_DEVELOPMENT_VERSION: 22.18.0

jobs:
  quality:
    name: Quality and distribution
    runs-on: ubuntu-latest
    env:
      JACI_STORYBOOK_BROWSER: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_DEVELOPMENT_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @jaci-ui/storybook exec playwright install --with-deps chromium
      - run: CI=true pnpm test
      - run: pnpm build
      - run: pnpm storybook:build
      - run: pnpm package:check
      - run: pnpm api:contract
      - run: pnpm fixtures:check
      - run: pnpm performance:check
      - run: pnpm package:contract
      - name: Pack publish tarball
        run: |
          artifact_dir="$GITHUB_WORKSPACE/.artifacts"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          pnpm --filter jaci-ui pack --pack-destination "$artifact_dir"

          mapfile -t tarballs < <(find "$artifact_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one package tarball, found ${#tarballs[@]}"
            find "$artifact_dir" -maxdepth 1 -type f -print
            exit 1
          fi

          echo "JACI_TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"
      - name: Validate packed fixtures
        run: pnpm fixtures:pack-check
      - uses: actions/upload-artifact@v4
        with:
          name: jaci-ui-tarball
          include-hidden-files: true
          path: ${{ github.workspace }}/.artifacts/*.tgz
          if-no-files-found: error

  framework-compatibility:
    name: Packed fixture (${{ matrix.fixture }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [vite, react18, react-router, next, remix, tree-shaking]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_DEVELOPMENT_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: jaci-ui-tarball
          path: .artifacts
      - name: Validate packed fixture
        run: JACI_TARBALL="$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)" JACI_FIXTURE="${{ matrix.fixture }}" pnpm compatibility:check

  node18-consumer:
    name: Node 18 consumer
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 18.18.0
      - uses: actions/download-artifact@v4
        with:
          name: jaci-ui-tarball
          path: .artifacts
      - name: Validate isolated Node 18 consumer
        run: node scripts/check-node18-consumer.mjs "$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
